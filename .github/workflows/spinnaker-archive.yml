# Spinnaker 1.25.4 service image archive: push the five archived images and echo to GHCR with
# the job's own GITHUB_TOKEN (no personal access token), verify them against the pins, record
# the digests (published.yaml) and attach that to the release.
#
# The five images exist only as files, uploaded once as assets of a GitHub release (see
# BUILDING.md); this workflow downloads them from that release, checks them against the pins in
# images/spinnaker/1.25.4/inputs.env, pushes with scripts/push-spinnaker.py and copies echo from
# gcr.io by digest. Runs only on a tag `spinnaker-1.25.4*` (publishing the release creates it) or
# by hand; there is no pull_request trigger, so nothing is pushed from a pull request.
# Third-party actions are pinned by commit SHA (tag in a comment).
name: spinnaker-archive

on:
  push:
    tags: ["spinnaker-1.25.4*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release holding the archive assets (a tag spinnaker-1.25.4*)"
        required: true
        default: "spinnaker-1.25.4"

permissions: {}

concurrency:
  group: spinnaker-archive
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write # read the release assets (a draft needs write) and attach published.yaml
      packages: write
    env:
      TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check the release tag name
        run: |
          case "$TAG" in
            spinnaker-1.25.4*) ;;
            *) echo "release tag must match spinnaker-1.25.4*: $TAG" >&2; exit 1 ;;
          esac
          if ! printf '%s' "$TAG" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "bad characters in the release tag" >&2; exit 1
          fi
          echo "ARCHIVES=$RUNNER_TEMP/spinnaker-archives" >> "$GITHUB_ENV"

      - name: Image namespace (registry.env, or the IMAGE_NAMESPACE repository variable)
        id: ns
        env:
          OVERRIDE: ${{ vars.IMAGE_NAMESPACE }}
        run: |
          source registry.env
          echo "namespace=${OVERRIDE:-$IMAGE_NAMESPACE}" >> "$GITHUB_OUTPUT"

      - name: Download the archives and the source bundle from the release
        run: |
          source images/spinnaker/1.25.4/inputs.env
          mkdir -p "$ARCHIVES"
          df -h "$ARCHIVES"
          args=(--repo "$GITHUB_REPOSITORY" --dir "$ARCHIVES" --pattern "$SOURCES_BUNDLE")
          for s in $SERVICES; do
            var="$(echo "$s" | tr a-z- A-Z_)_ARCHIVE"
            if [ -n "${!var:-}" ]; then args+=(--pattern "${!var}"); fi
          done
          gh release download "$TAG" "${args[@]}"
          ls -l "$ARCHIVES"

      - name: Check the source bundle against its pin
        run: |
          source images/spinnaker/1.25.4/inputs.env
          got=$(sha256sum "$ARCHIVES/$SOURCES_BUNDLE" | cut -d' ' -f1)
          [ "$got" = "$SOURCES_BUNDLE_SHA256" ] || { echo "source bundle sha256 $got, pinned $SOURCES_BUNDLE_SHA256" >&2; exit 1; }
          echo "source bundle ok: $got"

      - name: Check the archives against the pins (no registry contact)
        run: scripts/push-spinnaker.py --archive-dir "$ARCHIVES" --convert-only

      - name: Push the archive images and copy echo from gcr.io
        env:
          IMAGE_NAMESPACE: ${{ steps.ns.outputs.namespace }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/push-spinnaker.py --archive-dir "$ARCHIVES" --namespace "$IMAGE_NAMESPACE" --result push.json

      - name: Verify the pushed images against the pins (manifests, configs, every layer)
        env:
          IMAGE_NAMESPACE: ${{ steps.ns.outputs.namespace }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/verify-spinnaker.py --namespace "$IMAGE_NAMESPACE" --blobs

      - name: Record the digests (published.yaml)
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          scripts/write-published-spinnaker.py --result push.json \
            --source-revision "$GITHUB_SHA" --run-url "$RUN_URL"
          cat published.yaml >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: published
          path: published.yaml

      - name: Attach published.yaml to the release
        run: gh release upload "$TAG" published.yaml --clobber --repo "$GITHUB_REPOSITORY"
